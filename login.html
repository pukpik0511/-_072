

<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เข้าสู่ระบบ | เที่ยวบ้านเรา</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <header>
        <p class="site-name">เที่ยวบ้านเรา</p>

        <nav aria-label="เมนูหลัก">
            <ul>
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="places.html">ที่เที่ยว</a></li>
                <li><a href="food.html">อาหาร</a></li>
                <li><a href="plan.html">วางแผนเที่ยว</a></li>
                <li><a href="travel.html">ข้อมูลการเดินทาง</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="login-card">

            <h1>เข้าสู่ระบบ</h1>

            <p class="subtitle">
                ยินดีต้อนรับสู่เว็บไซต์เที่ยวบ้านเรา
            </p>

            <form onsubmit="login(event)">

                <label>ชื่อผู้ใช้</label>
                <input type="text" id="username"
                    placeholder="กรอกชื่อผู้ใช้" required>

                <label>รหัสผ่าน</label>

                <div class="password-box">
                    <input type="password" id="password"
                        placeholder="กรอกรหัสผ่าน" required>

                    <button type="button"
                        onclick="showPassword()">แสดง</button>
                </div>

                <label>ประเภทผู้ใช้งาน</label>

                <select id="role">
                    <option value="User">สมาชิก (User)</option>
                    <option value="Admin">ผู้ดูแลระบบ (Admin)</option>
                </select>

                <button type="submit" class="login-btn">
                    เข้าสู่ระบบ
                </button>

            </form>

            <div class="demo">
                <b>บัญชีทดลองสำหรับฝึกปฏิบัติ</b>
                <p>Admin: admin / admin123</p>
                <p>User: user / user123</p>
                <p>เลือกประเภทผู้ใช้ให้ตรงกับบัญชีที่เข้าสู่ระบบ</p>
            </div>

        </section>

    </main>

    <script>

        function showPassword() {
            let pass = document.getElementById("password");

            pass.type = pass.type === "password"
                ? "text" : "password";
        }

        function login(event) {
            event.preventDefault();

            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;
            let role = document.getElementById("role").value;

            if (
                (user === "admin" && pass === "admin123" && role === "Admin") ||
                (user === "user" && pass === "user123" && role === "User")
            ) {
                alert("เข้าสู่ระบบสำเร็จ");
                window.location.href = "index.html";
            } else {
                alert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
            }
        }

    </script>

</body>
</html>
